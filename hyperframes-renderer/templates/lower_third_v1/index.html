<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoCliper lower_third_v1</title>
  <style>
    :root {
      --w: 1080px;
      --h: 1920px;
      --accent: #22d3ee;
      --bg: rgba(12, 12, 16, 0.88);
      --fg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background: transparent;
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #stage video#base {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .lt {
      position: absolute;
      left: 48px;
      right: 48px;
      bottom: 220px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      border-radius: 16px;
      background: var(--bg);
      border-left: 6px solid var(--accent);
      color: var(--fg);
      opacity: 0;
      transform: translateY(24px);
      /* seekable-ish: driven by data-t via JS */
    }
    .lt .thumb {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
    }
    .lt .meta { min-width: 0; }
    .lt .label {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lt .sub {
      margin-top: 4px;
      font-size: 22px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <!--
    Template slots filled by assembler (no freestyle LLM HTML per clip):
      data-base-src, data-events JSON [{label, sub, start, end, thumb?}]
    Hook + subtitle stay on Remotion — this layer is polish only.
  -->
  <div id="stage"
       data-base-src="{{BASE_SRC}}"
       data-events='{{EVENTS_JSON}}'
       data-duration="{{DURATION}}">
    <video id="base" muted playsinline></video>
    <div id="overlays"></div>
  </div>
  <script type="module">
    const stage = document.getElementById('stage');
    const video = document.getElementById('base');
    const overlays = document.getElementById('overlays');
    const baseSrc = stage.dataset.baseSrc || '';
    let events = [];
    try { events = JSON.parse(stage.dataset.events || '[]'); } catch { events = []; }
    const duration = parseFloat(stage.dataset.duration || '0') || 0;

    if (baseSrc) {
      video.src = baseSrc;
      video.load();
    }

    const nodes = events.map((ev, i) => {
      const el = document.createElement('div');
      el.className = 'lt';
      el.dataset.start = String(ev.start ?? 0);
      el.dataset.end = String(ev.end ?? ((ev.start ?? 0) + 2.4));
      if (ev.thumb) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = ev.thumb;
        img.alt = '';
        el.appendChild(img);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = ev.label || ev.word || '';
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = ev.sub || ev.query_en || '';
      meta.appendChild(label);
      if (sub.textContent) meta.appendChild(sub);
      el.appendChild(meta);
      overlays.appendChild(el);
      return el;
    });

    // HyperFrames / preview: drive opacity from currentTime when available.
    function paint(t) {
      for (const el of nodes) {
        const a = parseFloat(el.dataset.start);
        const b = parseFloat(el.dataset.end);
        const on = t >= a && t < b;
        el.style.opacity = on ? '1' : '0';
        el.style.transform = on ? 'translateY(0)' : 'translateY(24px)';
        el.style.transition = 'opacity 180ms linear, transform 180ms linear';
      }
    }

    video.addEventListener('timeupdate', () => paint(video.currentTime || 0));
    // Export hook for headless/time-driven renderers
    window.__autocliperSeek = (t) => {
      try { video.currentTime = t; } catch {}
      paint(t);
    };
    paint(0);
    if (duration > 0) video.dataset.duration = String(duration);
  </script>
</body>
</html>
