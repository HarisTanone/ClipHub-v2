# AutoCliper Hermes profile — LOCAL == PRODUCTION
# Synced by: scripts/sync-hermes-config.sh
# Secrets live in $HERMES_HOME/.env (never commit).
#
# LLM path: Hermes → native Gemini (GEMINI_API_KEY di $HERMES_HOME/.env).
# Rotate mode (custom providers) diatur via UI Settings → LLM Providers
# (backend DB llm_providers) — endpoint ini generate snippet fallback_providers.

model:
  default: gemini-3.7-flash
  provider: gemini
  # api_key loaded from $HERMES_HOME/.env → GEMINI_API_KEY (alias GOOGLE_API_KEY)

providers: {}
fallback_providers: []
credential_pool_strategies: {}

toolsets:
  - hermes-cli
  - autocliper   # AutoCliper custom toolset (viral search, submit job, dll)

max_live_sessions: 16

agent:
  max_turns: 150
  gateway_timeout: 1800
  api_max_retries: 3
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  coding_context: auto
  verify_on_stop: false
  reasoning_effort: medium
  verbose: false

terminal:
  backend: local
  timeout: 180
  cwd: ""   # set by workdir / project root at runtime

display:
  interface: cli
  tool_progress: new
  show_reasoning: false
  show_cost: false
  language: id

memory:
  memory_enabled: true
  user_profile_enabled: true

security:
  redact_secrets: true

approvals:
  mode: smart

delegation:
  max_iterations: 50

# Auxiliary tasks also go through 9router when possible
auxiliary: {}

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
